<!doctype html>
<!--
The exact SVA monogram rests in the paper as a quiet, tone-on-tone watermark.
The centred live name remains the first reading, with the mark revealing itself behind it.
Mark: approximately 450 × 658 px at 1440 × 900 and 289 × 422 px at 390 × 844,
with paper at 6.5% opacity; name: 62 px / 26 px, keeping generous margins and a calm hierarchy.
-->
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2a3220">
  <title>Sáenz Valiente &amp; Asociados — Filigrana</title>
  <style>
    @font-face {
      font-family: "Valiente Display";
      src: url("../../src/assets/fonts/ValienteDisplay-Light.woff2") format("woff2");
      font-style: normal;
      font-weight: 300;
      font-display: swap;
    }

    @font-face {
      font-family: "Jost";
      src: url("../../src/assets/fonts/jost-latin-wght-normal.woff2") format("woff2");
      font-style: normal;
      font-weight: 300 400;
      font-display: swap;
    }

    :root {
      --paper: #f1ede2;
      --forest: #2a3220;
      --sage: #a9b09a;
      --ink: #1d1d1b;
      color: var(--paper);
      background: var(--forest);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: clamp(24px, 4vmin, 48px);
    }

    .hero__paper {
      position: absolute;
      inset: 0;
      z-index: -2;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 78% 30%;
    }

    .hero__watermark {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      display: block;
      width: min(74vw, 28.25rem, 50vh);
      width: min(74vw, 28.25rem, 50dvh);
      height: auto;
      aspect-ratio: 581 / 849;
      color: var(--paper);
      opacity: 0.065;
      /* Filled-area centre ≈ (267, 431): compensate for the S's leftward weight. */
      transform: translate(-46%, -50.75%);
      pointer-events: none;
    }

    .wordmark {
      width: fit-content;
      margin: 0;
      font-family: "Valiente Display", sans-serif;
      font-size: clamp(1.625rem, 4.31vw, 3.875rem);
      font-style: normal;
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .wordmark__name {
      display: block;
      /* Remove trailing tracking so the visible name is centred. */
      margin-right: -0.08em;
    }

    .wordmark__sub {
      display: block;
      width: fit-content;
      margin: 0.7em -0.22em 0 auto;
      color: var(--sage);
      font-family: "Jost", sans-serif;
      font-size: max(0.8125rem, 0.3em);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.22em;
    }

    @media (max-width: 359px) {
      .wordmark { font-size: 7.2vw; }
    }
  </style>
</head>
<body>
  <main class="hero" aria-labelledby="hero-title">
    <img class="hero__paper" src="../../src/assets/art/fig-01-papel.jpg"
      alt="" width="2400" height="1500" fetchpriority="high">
    <svg class="hero__watermark" viewBox="0 0 581 849" fill="currentColor"
      aria-hidden="true" focusable="false">
      <path transform="translate(0,849) scale(0.1,-0.1)" d="M1165 8404 c-249 -34 -387 -71 -530 -142 -348 -172 -529 -464 -529 -852 1 -513 296 -838 1204 -1319 457 -243 731 -447 905 -675 227 -299 254 -661 69 -948 -59 -93 -200 -227 -218 -207 -2 2 -123 285 -269 629 -146 344 -271 637 -278 653 l-12 27 -265 0 c-247 0 -264 -1 -259 -17 2 -10 143 -339 312 -732 209 -485 304 -716 297 -723 -19 -19 -402 -3 -525 21 -332 67 -593 207 -834 448 -76 75 -123 116 -123 105 0 -9 -7 -75 -15 -147 -8 -71 -15 -140 -15 -152 0 -19 17 -32 98 -72 384 -192 830 -294 1271 -290 l194 2 588 -1368 c324 -753 593 -1373 598 -1378 4 -4 26 -7 47 -5 l38 3 112 260 111 260 732 3 731 2 10 -22 c5 -13 57 -158 114 -323 138 -397 474 -1344 482 -1356 6 -10 524 -13 524 -3 0 3 -353 932 -785 2064 l-784 2060 83 197 c131 311 344 779 472 1036 l64 128 -116 -3 -116 -3 -53 -160 c-145 -443 -533 -1419 -1060 -2665 -108 -256 -233 -552 -277 -658 -54 -128 -84 -188 -90 -179 -15 28 -949 2230 -946 2232 2 2 44 23 93 48 634 319 820 1053 407 1607 -188 253 -486 467 -1092 785 -753 396 -994 662 -994 1100 -1 445 314 672 906 652 440 -15 792 -190 1024 -511 l22 -30 5 30 c3 16 11 79 17 139 6 61 13 124 15 141 5 30 4 31 -102 82 -341 161 -607 222 -993 227 -129 2 -248 1 -265 -1z m3083 -5639 c171 -473 313 -868 317 -877 7 -17 -30 -18 -689 -18 -383 0 -696 4 -696 9 0 4 74 181 163 392 90 211 258 607 373 880 115 273 212 492 216 485 3 -6 146 -398 316 -871z"/>
    </svg>
    <h1 class="wordmark" id="hero-title">
      <span class="wordmark__name">SÁENZ VALIENTE</span>
      <span class="wordmark__sub">&amp; ASOCIADOS</span>
    </h1>
  </main>
</body>
</html>
