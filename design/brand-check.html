<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><title>Brand check</title>
<link rel="stylesheet" href="../src/styles/tokens.css">
<style>body{margin:0;background:var(--ink);color:var(--paper);font:12px var(--font-mono);padding:24px}
.row{display:flex;gap:24px;align-items:flex-end;margin-bottom:24px}.row img{display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:24px}.cmp>div{background:#000;padding:12px}
.small span{display:inline-grid;place-items:center;background:var(--forest);margin-right:12px}
.light{background:var(--paper);color:var(--ink);padding:16px;display:flex;gap:32px;align-items:center}</style></head><body>
<div class="cmp"><div><p>ORIGINAL PNG</p><img src="../_source/images/LOGO.png" style="width:100%"></div>
<div><p>TRACED SVG</p><img src="../src/assets/brand/lockup.svg" style="width:100%;filter:invert(1)"></div></div>
<div class="cmp" style="margin-top:24px"><div><p>ORIGINAL ×3 (S detail)</p><div style="height:420px;overflow:hidden"><img src="../_source/images/LOGO.png" style="width:4971px;margin:-60px 0 0 -60px"></div></div>
<div><p>TRACED ×3</p><div style="height:420px;overflow:hidden"><img src="../src/assets/brand/lockup.svg" style="width:4863px;margin:-24px 0 0 -24px;filter:invert(1)"></div></div></div>
<p>FAVICON SIZES (monogram on forest)</p>
<div class="row small"><span style="width:16px;height:16px"><img src="../src/assets/brand/monogram.svg" style="height:13px;filter:invert(1)"></span>
<span style="width:32px;height:32px"><img src="../src/assets/brand/monogram.svg" style="height:26px;filter:invert(1)"></span>
<span style="width:48px;height:48px"><img src="../src/assets/brand/monogram.svg" style="height:40px;filter:invert(1)"></span>
<span style="width:180px;height:180px"><img src="../src/assets/brand/monogram.svg" style="height:130px;filter:invert(1)"></span></div>
<div class="light"><img src="../src/assets/brand/lockup.svg" style="height:56px"><img src="../src/assets/brand/monogram.svg" style="height:56px"><img src="../src/assets/brand/wordmark.svg" style="height:40px"></div>
</body></html>
